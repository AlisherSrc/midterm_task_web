# Space Bounty Hunters — Multi-container Docker Application
# Start everything with: docker compose up --build

name: space-bounty-hunters

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database Service (PostgreSQL 16)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: bounty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-space_bounty_hunters}
    volumes:
      - bounty_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bounty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-space_bounty_hunters}"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------------------------------------------------------------------------
  # FastAPI REST API Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-bounty-hunters-backend:latest
    container_name: bounty-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-space_bounty_hunters}
      APP_PORT: 8000
      APP_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - bounty-net

networks:
  bounty-net:
    name: bounty-net
    driver: bridge

volumes:
  bounty_pgdata:
    name: bounty_pgdata
